name: RoboTwin
domain: Manipulation
subtype: dual-arm
first_release_date: 2024-09-04
description: "A dual-arm manipulation benchmark and data-generation framework that uses generative 3D models and LLMs to create diverse bimanual task scenarios. RoboTwin provides a real-to-sim “digital twin” pipeline to generate varied object models and expert demonstrations, and an evaluation platform aligned with a real dual-arm robot (COBOT Magic platform). It combines simulated expert data with real-world teleoperated demos for coordinated two-arm tasks."
task_count: "50"
metric_count: "1 (task success rate)"
robot_config_count: 1
modalities: [RGB, depth, language]
setting: [sim, real]
sim_backend: "Custom (generative pipeline with spatial planner; real robot: COBOT Magic)"
data_source:
  size: "Synthetic dataset (hundreds of expert demos) + limited real demos per task"
  collection_method: both
resources:
  homepage: "https://robotwin-platform.github.io/"
  paper: "https://arxiv.org/abs/2409.02920 "
  code: "https://github.com/RoboTwin-Platform/RoboTwin"
  data: "https://github.com/RoboTwin-Platform/RoboTwin/tree/main/data (simulated & real data)"
  leaderboard: "https://robotwin-platform.github.io (CVPR 2025 Challenge)"
