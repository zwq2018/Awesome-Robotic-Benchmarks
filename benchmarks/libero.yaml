name: LIBERO
domain: Manipulation
subtype: table-top  # See subtype options below
first_release_date: 2023-10-01

# Brief 1-2 sentence description
description: "A benchmark for lifelong robot learning featuring multitask manipulation with language conditioning. Focuses on knowledge transfer and generalization across diverse manipulation tasks."

# Task and evaluation details
tasks: 
  - multitask-manipulation
  - language-conditioned
  - sequential-tasks
  - generalization

metrics: 
  - success_rate
  - multitask_generalization
  - transfer_efficiency
  - sample_efficiency

# Robot configuration support
robot_config:
  - mobile-manipulator
  - fixed-base-arm
  - franka-emika

# Data characteristics  
modality: 
  - RGB
  - depth
  - proprioceptive
  - language

setting: 
  - sim
  - real

# Dataset information
data_source:
  size: "50+ tasks, 2500+ demonstrations"
  collection_method: "human_teleoperation"  # human_teleoperation, motion_planner, both, synthetic

# Resources
resources:
  homepage: "https://libero-project.github.io/"
  paper: "https://arxiv.org/abs/2310.08531"
  code: "https://github.com/Lifelong-Robot-Learning/LIBERO"
  data: "https://libero-project.github.io/"
  leaderboard: ""