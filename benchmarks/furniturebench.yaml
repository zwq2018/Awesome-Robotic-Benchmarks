name: FurnitureBench
domain: Manipulation
subtype: table-top
first_release_date: 2023-05-22

description: "Reproducible real-world furniture assembly benchmark with standardized hardware/setup, 3D-printed parts, large teleoperation dataset, and a matching simulator (FurnitureSim)."

task_count: 8
metric_count: 2
robot_config_count: 1

modality: [RGB, proprioceptive]

setting: [real, sim]
sim_backend: "NVIDIA Isaac Gym / PhysX (Factory) via FurnitureSim"

data_source:
  size: "≈219.6 hours, 5100 successful demonstrations"
  collection_method: "human_demonstration"

resources:
  homepage: "https://clvrai.github.io/furniture-bench/"
  paper: "https://arxiv.org/abs/2305.12821"
  code: "https://github.com/clvrai/furniture-bench"
  data: "https://clvrai.github.io/furniture-bench/docs/tutorials/dataset.html"

