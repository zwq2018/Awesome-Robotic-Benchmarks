name: RoboCerebra
domain: Manipulation
subtype: table-top
first_release_date: 2025-06-07
description: "A benchmark for evaluating high-level reasoning in long-horizon manipulation. RoboCerebra provides a large-scale simulation dataset of complex household tasks with extended subtask sequences, generated by GPT-based instruction decomposition and executed by human operators in simulatio. It emphasizes “System 2” planning skills (deliberative, goal-directed thinking) in vision-language-conditioned manipulation."
task_count: "1,000 training tasks + 60 held-out tasks (1,060 total)"
metric_count: "2 (sequence success rate and subtask completion)"
robot_config_count: 1
modality: [RGB, language, proprioceptive]
setting: [sim]
sim_backend: "Not specified (custom sim with human teleoperation for data)"
data_source:
  size: "100k+ trajectories (e.g. 50 human demos ×25 skills + synthetic expansions)"
  collection_method: both
resources:
  homepage: "https://robocerebra.github.io (if available)"
  paper: "https://arxiv.org/abs/2506.06677"
  code: "NA"
  data: "https://huggingface.co/datasets/qiukingballball/RoboCerebra "
  leaderboard: "N/A"
