name: RLBench
domain: Manipulation
subtype: table-top
first_release_date: 2019-09-26
description: "A large-scale learning environment featuring 100 unique vision-guided manipulation tasks of varying difficulty. RLBench provides multimodal observations (RGB, depth, segmentation, proprioception) from multiple camera angles and an *infinite* supply of demonstration trajectories generated via built-in motion planners."
task_count: "100"
metric_count: "1 (task success rate)"
robot_config_count: 1
modality: [RGB, depth, segmentation, proprioceptive]
setting: [sim]
sim_backend: "CoppeliaSim (V-REP)"
data_source:
  size: "100 tasks × infinite demos (motion planner can generate unlimited trajectories)"
  collection_method: motion_planner
resources:
  homepage: "https://sites.google.com/view/rlbench "
  paper: "https://arxiv.org/abs/1909.12271 "
  code: "https://github.com/stepjam/RLBench "

