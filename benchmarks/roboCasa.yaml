name: RoboCasa
domain: Simulation
first_release_date: 2024-06-04

description: "A large-scale simulation framework for training generalist robots in realistic kitchen environments: 120 scenes, 2,500+ objects, and 100 tasks (25 atomic + 75 composite). Includes 100K+ trajectories from human teleop and automated generation."
tasks: [atomic-skills, composite-long-horizon, kitchen-activities, mobile-manipulation]
metrics: [success_rate, task_completion, generalization]
robot_config: [mobile-manipulator, fixed-base-arm, humanoid, quadruped-with-arm]
modality: [RGB, depth, proprioceptive]
setting: [sim]
data_source:
  size: "100K+ trajectories across 100 tasks"
  collection_method: "both"
resources:
  homepage: "https://robocasa.ai/"
  paper: "https://arxiv.org/abs/2406.02523"
  code: "https://github.com/robocasa/robocasa"
  data: "https://robocasa.ai/docs/introduction/installation.html"
leaderboard: ""